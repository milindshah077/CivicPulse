.topbar{gap:35px}.brand{letter-spacing:-.8px}.topbar nav{gap:12px}.topbar nav button{gap:9px;padding:15px 13px;white-space:nowrap}.account{background:#ffffff09;color:#d9deed}.menu{padding:7px}.topbar nav svg{flex-shrink:0}dialog{border:1px solid var(--line);border-radius:16px;padding:28px;max-width:420px;width:calc(100% - 32px);color:var(--text)}dialog::backdrop{background:#0b132b66}dialog h2{margin:0 0 10px;font-size:22px}dialog p{line-height:1.6;color:var(--muted);margin:0 0 22px}.dialog-ok{height:44px;width:100%;border:1px solid var(--blue);border-radius:8px;background:var(--blue);color:white;font-weight:650}@media(max-width:900px) and (min-width:701px){.topbar{padding:0 24px;gap:18px}.brand{font-size:22px}.topbar nav{gap:0}.topbar nav button{padding:14px 10px;font-size:14px}.topbar nav svg{display:none}.account{display:none}}@media(max-width:700px){.brand{font-size:22px;gap:10px}.logo{border-radius:10px}.logo svg{width:22px;height:22px}.account{width:32px;height:32px}.account svg{width:18px}.topbar nav{padding:8px 16px 18px;gap:8px}.topbar nav button{font-size:14px;padding:14px 10px}.topbar nav svg{display:block;width:18px}}</style></head><body>

<header class="topbar"><button class="menu" aria-label="Open menu" aria-expanded="false" aria-controls="navigation"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button><div class="brand"><span class="logo" role="img" aria-label="App logo placeholder" title="App logo placeholder"><svg><use href="#pin"/></svg></span>Civic Pulse</div><nav id="navigation" aria-label="Main navigation"><button class="active" aria-current="page"><svg><use href="#pin"/></svg>Near You</button><button data-page="civic-pulse.html"><svg><use href="#report"/></svg>New Report</button><button data-unavailable="My Reports"><svg><use href="#list"/></svg>My Reports</button><button data-unavailable="Updates"><svg><use href="#bell"/></svg>Updates</button></nav><span class="account" role="img" aria-label="Profile placeholder"><svg><use href="#user"/></svg></span></header>
<section class="hero"><div class="hero-inner"><h1>Issues Near You</h1><p>See what’s happening around your neighborhood.</p></div></section>
<main class="content"><section class="map-card"><div class="toolbar"><strong class="count" id="count">10 issues near you</strong><div class="filters" id="filters"></div><label class="sort-wrap"><span>Sort by</span><select id="sort"><option value="sequence">Default order</option><option value="nearest">Nearest</option><option value="recent">Most recent</option><option value="priority">Priority</option><option value="affected">Most affected</option></select></label></div><div class="map" id="map" aria-label="Map of nearby civic issues"></div><div class="legend"><span style="color:#f59e0b"><i class="dot"></i>Electrical</span><span style="color:#ef4444"><i class="dot"></i>Safety</span><span style="color:#2580e9"><i class="dot"></i>Water</span><span style="color:#0b9878"><i class="dot"></i>Waste & environment</span><span style="color:#67748d"><i class="dot"></i>Infrastructure</span></div></section><div class="issue-heading"><div><h2>Nearby issues</h2><p>Select an issue to follow it or mark yourself as affected.</p></div></div><section class="issue-list" id="issues" aria-live="polite"></section></main>
<dialog id="unavailable-dialog"><h2 id="unavailable-title"></h2><p>This page is not part of this preview yet.</p><button class="dialog-ok" id="unavailable-ok">OK</button></dialog><script>
const $=s=>document.querySelector(s);let allIssues=[],activeFilter='All',selectedId=null;const priorityRank={critical:4,high:3,medium:2,low:1};
const formatDate=value=>new Date(value+'T00:00:00').toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'});const locationText=i=>[i.location.landmark,i.location.area,i.location.city].filter(Boolean).join(', ');
function typeFor(i){const text=(i.category+' '+i.title).toLowerCase();if(/electric|power/.test(text))return'electrical';if(/water|lake/.test(text))return'water';if(/safety|statue/.test(text))return'safety';if(/waste|sanitation|pollution|environment|smoke/.test(text))return'waste';return'infrastructure'}
const symbolFor=t=>({electrical:'bolt',water:'drop',safety:'alert',waste:'leaf',infrastructure:'home'}[t]);
function buildMap(items){const map=$('#map');map.replaceChildren();const positions=[[8,21],[22,55],[38,25],[54,57],[68,18],[82,52],[14,72],[33,75],[71,73],[89,20]];items.slice(0,10).forEach((i,n)=>{const type=typeFor(i),pin=document.createElement('span');pin.className='pin '+type;pin.style.left=positions[n][0]+'%';pin.style.top=positions[n][1]+'%';pin.title=i.title;pin.innerHTML=`<svg><use href="#pin"/></svg><svg class="symbol"><use href="#${symbolFor(type)}"/></svg>`;pin.onclick=()=>{selectedId=i.instanceId;render()};map.append(pin)});const you=document.createElement('span');you.className='pin you';you.style.left='48%';you.style.top='40%';you.innerHTML='<svg><use href="#pin"/></svg><span class="you-label">You</span>';map.append(you)}
function card(i){const article=document.createElement('article');article.className='issue-card'+(i.instanceId===selectedId?' selected':'');article.tabIndex=0;article.setAttribute('role','button');article.setAttribute('aria-expanded',String(i.instanceId===selectedId));article.onclick=e=>{if(e.target.closest('.action'))return;if(selectedId===i.instanceId){location.href='issue-details.html?id='+encodeURIComponent(i.id);return}selectedId=i.instanceId;render()};article.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();article.click()}};const reported=i.timeline.find(t=>t.date)?.date||'';article.innerHTML=`<div class="thumb"><img src="${i.image}" alt="" onerror="this.replaceWith(document.createRange().createContextualFragment('<svg><use href=&quot;#image&quot;/></svg>'))"></div><div class="card-main"><h3>${i.title}</h3><p class="desc">${i.description}</p><div class="meta"><span><svg><use href="#people"/></svg>${i.peopleImpacted} affected</span><span><svg><use href="#image"/></svg>${i.evidences} evidence</span><span><svg><use href="#clock"/></svg>${formatDate(reported)}</span><span><svg><use href="#pin"/></svg>${i.location.area} · ${i.location.distanceKm.toFixed(1)} km</span></div></div><span class="priority ${i.priority}">${i.priority}</span><div class="card-actions"><button class="action follow" aria-pressed="${i.followed}"><svg><use href="#bookmark"/></svg><span>${i.followed?'Following':'Follow'}</span></button><button class="action primary affected" aria-pressed="${i.affected}"><svg><use href="#people"/></svg><span>${i.affected?'I’m Affected ✓':'I’m Affected'}</span></button></div>`;article.querySelector('.follow').onclick=()=>{i.followed=!i.followed;render()};article.querySelector('.affected').onclick=()=>{i.affected=!i.affected;i.peopleImpacted+=i.affected?1:-1;render()};return article}
function filtered(){let rows=activeFilter==='All'?allIssues:allIssues.filter(i=>typeFor(i)===activeFilter.toLowerCase());const sort=$('#sort').value;return sort==='sequence'?[...rows]:[...rows].sort((a,b)=>sort==='nearest'?a.location.distanceKm-b.location.distanceKm:sort==='recent'?new Date(b.timeline[0]?.date)-new Date(a.timeline[0]?.date):sort==='priority'?priorityRank[b.priority]-priorityRank[a.priority]:b.peopleImpacted-a.peopleImpacted)}
function render(){const rows=filtered(),list=$('#issues');$('#count').textContent=`${rows.length} issue${rows.length===1?'':'s'} near you`;list.replaceChildren();if(!rows.length){list.innerHTML='<div class="empty">No issues match this filter.</div>'}else rows.forEach(i=>list.append(card(i)));buildMap(rows)}
function filters(){const values=['All','Roads','Water','Electrical','Safety','Waste'];const root=$('#filters');values.forEach(label=>{const button=document.createElement('button');button.className='chip'+(label==='All'?' active':'');button.textContent=label;button.onclick=()=>{activeFilter=label==='Roads'?'Infrastructure':label;root.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active',b===button));selectedId=null;render()};root.append(button)})}
fetch('mock-data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(records=>{allIssues=[...records,...records].map((i,n)=>({...i,instanceId:i.id+'-'+n,location:{...i.location,distanceKm:+(i.location.distanceKm+(n>=records.length ? .35 : 0)).toFixed(1)},peopleImpacted:i.peopleImpacted+(n>=records.length?7:0),followed:false,affected:false}));filters();render()}).catch(()=>{$('#issues').innerHTML='<div class="empty">Issue data could not be loaded. Open this page from the local preview.</div>'});$('#sort').onchange=render;document.querySelector('[data-page]').onclick=()=>location.href='civic-pulse.html';document.querySelectorAll('[data-unavailable]').forEach(button=>button.onclick=()=>{$('#unavailable-title').textContent=button.dataset.unavailable;$('#unavailable-dialog').showModal();document.querySelector('.topbar nav').classList.remove('open');$('.menu').setAttribute('aria-expanded','false')});$('#unavailable-ok').onclick=()=>$('#unavailable-dialog').close();$('.menu').onclick=()=>{const nav=document.querySelector('.topbar nav'),open=nav.classList.toggle('open');$('.menu').setAttribute('aria-expanded',String(open))};
</script></body></html>
