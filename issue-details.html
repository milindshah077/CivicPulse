<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="View complete civic issue details."><title>Issue Details · Civic Pulse</title>
<style>
:root{--navy:#0b132b;--blue:#3d5afe;--cyan:#00c2ff;--green:#0b9878;--green-soft:#e7f7f0;--gray:#f6f7fb;--muted:#6b7280;--text:#0f172a;--line:#e4e7ef;--white:#fff;--red:#ed4352}*{box-sizing:border-box}body{margin:0;background:#f3faf6;color:var(--text);font:16px Inter,"Segoe UI",Arial,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.topbar{height:88px;background:linear-gradient(110deg,var(--navy),#0b1025);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 max(32px,calc((100vw - 1200px)/2));gap:35px}.brand{display:flex;align-items:center;gap:12px;white-space:nowrap;font-size:24px;font-weight:700;letter-spacing:-.8px}.logo{width:42px;height:42px;border:1px dashed #8bcaff;border-radius:12px;display:grid;place-items:center;color:#a9e9ff;background:#ffffff09}.logo svg{width:25px;height:25px}.topbar nav{display:flex;gap:12px;height:100%;align-items:center}.topbar nav button{display:flex;align-items:center;gap:9px;background:none;border:0;color:#d7d9e8;padding:15px 13px;font-size:15px;white-space:nowrap}.account{border:1px solid #ffffff25;background:#ffffff09;color:#d9deed;border-radius:50%;height:38px;width:38px;display:grid;place-items:center}.menu{display:none;background:transparent;border:0;color:white;padding:7px}.hero{background:linear-gradient(120deg,#edf8f2,#fafdfb 65%,#e6f5ed);padding:34px 24px 52px}.hero-inner{max-width:1060px;margin:auto}.hero h1{font-size:37px;letter-spacing:-1.1px;margin:0 0 7px}.hero p{margin:0;color:#687188;font-size:15px}.content{max-width:1060px;margin:-28px auto 48px;padding:0 14px}.card{background:white;border:1px solid #e8ece9;border-radius:15px;box-shadow:0 4px 15px #19342609}.overview{padding:18px;display:grid;grid-template-columns:285px 1fr;gap:24px}.issue-image{min-height:235px;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#f0f2f7,#e9e6ff);display:grid;place-items:center;color:#9298aa}.issue-image img{width:100%;height:100%;object-fit:cover}.issue-image svg{width:48px;height:48px}.overview-main{min-width:0}.priority{display:inline-flex;background:#fff0f1;color:var(--red);border-radius:18px;padding:7px 11px;font-size:12px;font-weight:650;text-transform:capitalize}.priority.medium{background:#fff7e3;color:#be7200}.overview h2{font-size:25px;margin:10px 0 9px;letter-spacing:-.7px}.description{color:#5f6980;line-height:1.55;margin:0 0 15px}.info-row{display:flex;gap:25px;flex-wrap:wrap;color:#637087;font-size:13px}.info-row span{display:flex;gap:7px;align-items:center}.info-row svg{width:18px;color:#506790}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.metric{border:1px solid #e9ebf0;border-radius:10px;padding:11px;display:flex;align-items:center;gap:10px}.metric svg{color:var(--green)}.metric strong{display:block;font-size:17px}.metric small{display:block;color:#737b90;font-size:11px}.detail-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:14px;align-items:start}.brief,.reports,.timeline-card{padding:18px}.section-title{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:18px}.section-title svg{color:var(--green)}.brief p{margin:0;color:#626c82;line-height:1.55;font-size:14px}.reports{margin-top:14px}.report-list{display:grid;gap:8px}.citizen{display:grid;grid-template-columns:38px 100px 1fr;gap:11px;align-items:center;border:1px solid #e8ece9;border-radius:9px;padding:11px}.avatar{width:36px;height:36px;border-radius:50%;background:var(--green-soft);color:#087558;display:grid;place-items:center;font-weight:700}.citizen strong{font-size:13px}.citizen time{display:block;color:#747c8e;font-size:11px;margin-top:3px}.citizen p{margin:0;color:#5f6980;font-size:12px;line-height:1.45}.timeline{list-style:none;padding:0;margin:0 0 0 9px}.timeline li{position:relative;padding:0 0 25px 35px;font-size:12px;color:#677187}.timeline li:before{content:"";position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;background:#d7dce5;border:4px solid #eef0f4;box-sizing:border-box;z-index:1}.timeline li:after{content:"";position:absolute;left:10px;top:22px;bottom:-1px;width:2px;background:#d7dce5}.timeline li.done:before{background:var(--green);border-color:var(--green)}.timeline li.active:before{background:white;border-color:#2e79ed}.timeline li:last-child:after{display:none}.timeline strong{display:block;color:var(--text);font-size:13px;margin-bottom:4px}.timeline .expected{display:inline-flex;background:#e6f0ff;color:#1765d7;padding:5px 7px;border-radius:6px;margin-top:5px}.actions{position:sticky;bottom:0;margin-top:14px;padding:13px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;z-index:4}.action{height:46px;border:1px solid var(--green);border-radius:8px;background:white;color:var(--green);font-weight:650;display:flex;align-items:center;justify-content:center;gap:9px}.action.primary{background:var(--green);color:white}dialog{border:1px solid var(--line);border-radius:16px;padding:28px;max-width:420px;width:calc(100% - 32px)}dialog::backdrop{background:#0b132b66}dialog h2{font-size:21px;margin:0 0 10px}dialog p{color:var(--muted);line-height:1.55;margin:0 0 22px}.ok{width:100%;height:44px;border:0;border-radius:8px;background:var(--blue);color:white;font-weight:650}.empty{padding:40px;text-align:center}.back{display:inline-flex;margin-bottom:11px;border:0;background:transparent;color:#51617a;align-items:center;gap:6px;padding:0}.back svg{width:18px}
@media(max-width:900px) and (min-width:651px){.topbar{padding:0 24px;gap:18px}.brand{font-size:22px}.topbar nav{gap:0}.topbar nav button{padding:14px 10px;font-size:14px}.topbar nav svg{display:none}.account{display:none}.overview{grid-template-columns:240px 1fr}.detail-grid{grid-template-columns:1fr}}
@media(max-width:650px){.topbar{height:76px;padding:0 17px;gap:10px}.brand{font-size:22px;gap:10px}.logo{width:35px;height:35px;border-radius:10px}.logo svg{width:22px;height:22px}.account{width:32px;height:32px}.account svg{width:18px}.menu{display:block}.topbar nav{display:none;position:absolute;top:76px;left:0;right:0;height:auto;background:var(--navy);padding:8px 16px 18px;z-index:20;grid-template-columns:1fr 1fr;gap:8px}.topbar nav.open{display:grid}.topbar nav button{font-size:14px;justify-content:flex-start;padding:14px 10px}.hero{padding:25px 19px 43px}.hero h1{font-size:28px}.hero p{font-size:13px;line-height:1.45}.content{margin-top:-22px;padding:0 10px;margin-bottom:22px}.overview{padding:12px;grid-template-columns:1fr;gap:12px}.issue-image{min-height:190px}.overview h2{font-size:21px}.description{font-size:13px}.info-row{display:grid;gap:8px}.metrics{gap:6px}.metric{padding:8px;gap:6px}.metric svg{width:19px}.metric strong{font-size:15px}.detail-grid{grid-template-columns:1fr;gap:10px;margin-top:10px}.brief,.reports,.timeline-card{padding:14px}.reports{margin-top:10px}.section-title{font-size:16px}.citizen{grid-template-columns:35px 1fr}.citizen p{grid-column:1/3}.actions{gap:6px;padding:8px}.action{height:51px;font-size:12px;line-height:1.15;flex-direction:column;gap:3px;padding:5px}.action svg{width:19px}}
</style></head><body>
<svg style="display:none"><defs><symbol id="pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol><symbol id="report" viewBox="0 0 24 24"><path d="M12 21H3V3h15v8M7 7h7M7 11h7M7 15h3M13 18l6-6 3 3-6 6-4 1Z"/></symbol><symbol id="list" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="19" rx="1"/><path d="M9 2h6v3H9zM9 10h6M9 14h6M9 18h4"/></symbol><symbol id="bell" viewBox="0 0 24 24"><path d="M5 9a7 7 0 0 1 14 0v6l2 3H3l2-3ZM10 21h4"/></symbol><symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></symbol><symbol id="image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m3 17 6-6 4 4 3-3 5 5"/></symbol><symbol id="people" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M2 21v-3a7 7 0 0 1 14 0v3"/></symbol><symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6M17 2v6M3 11h18"/></symbol><symbol id="sparkles" viewBox="0 0 24 24"><path d="m10 3 2 6 6 2-6 2-2 7-2-7-6-2 6-2ZM19 2v6M16 5h6"/></symbol><symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></symbol><symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4Z"/></symbol><symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol><symbol id="arrow" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol></defs></svg>
<header class="topbar"><button class="menu" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button><div class="brand"><span class="logo"><svg><use href="#pin"/></svg></span>Civic Pulse</div><nav><button data-page="near-you.html"><svg><use href="#pin"/></svg>Near You</button><button data-page="civic-pulse.html"><svg><use href="#report"/></svg>New Report</button><button data-unavailable="My Reports"><svg><use href="#list"/></svg>My Reports</button><button data-unavailable="Updates"><svg><use href="#bell"/></svg>Updates</button></nav><span class="account"><svg><use href="#user"/></svg></span></header>
<section class="hero"><div class="hero-inner"><h1>Issue Details</h1><p>Track this issue, follow updates, and contribute evidence.</p></div></section><main class="content"><button class="back" onclick="location.href='near-you.html'"><svg><use href="#arrow"/></svg>Back to nearby issues</button><div id="view"><section class="card empty">Loading issue details…</section></div></main>
<dialog id="unavailable"><h2 id="dialog-title">Unavailable in preview</h2><p>This function is not part of this preview yet.</p><button class="ok" id="ok">OK</button></dialog>
<script>
const $=s=>document.querySelector(s),formatDate=v=>v?new Date(v+'T00:00:00').toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'}):'';const icon=id=>`<svg><use href="#${id}"/></svg>`;function locationText(i){return[i.location.landmark,i.location.area,i.location.city].filter(Boolean).join(', ')}function image(i){return `<div class="issue-image"><img src="${i.image}" alt="Evidence for ${i.title}" onerror="this.replaceWith(document.createRange().createContextualFragment('<svg><use href=&quot;#image&quot;/></svg>'))"></div>`}function timeline(items){return items.map((t,n)=>`<li class="${t.type==='reported'||t.type==='assigned'?'done':t.type==='status'?'active':''}"><strong>${t.title}</strong>${t.date?formatDate(t.date):t.status||''}<br>${t.department||t.description||''}${t.expectedResolutionDate?`<br><span class="expected">Expected by ${formatDate(t.expectedResolutionDate)}</span>`:''}</li>`).join('')}function render(i){document.title=i.title+' · Civic Pulse';const first=i.timeline.find(t=>t.date);$('#view').innerHTML=`<article class="card overview">${image(i)}<div class="overview-main"><span class="priority ${i.priority}">${i.priority} priority</span><h2>${i.title}</h2><p class="description">${i.description}</p><div class="info-row"><span>${icon('pin')}${locationText(i)}</span><span>${icon('calendar')}${formatDate(first?.date)} · First reported</span></div><div class="metrics"><div class="metric">${icon('people')}<span><strong>${i.peopleImpacted}</strong><small>People affected</small></span></div><div class="metric">${icon('image')}<span><strong>${i.evidences}</strong><small>Evidence files</small></span></div><div class="metric">${icon('people')}<span><strong>${i.peopleFollowing}</strong><small>Following</small></span></div></div></div></article><div class="detail-grid"><div><article class="card brief"><h2 class="section-title">${icon('sparkles')}AI Situation Brief</h2><p>${i.aiSituationBrief}</p></article><article class="card reports"><h2 class="section-title">${icon('report')}Citizen Reports (${i.citizenReports.length})</h2><div class="report-list">${i.citizenReports.map(r=>`<article class="citizen"><span class="avatar">${r.name[0]}</span><div><strong>${r.name}</strong><time>${formatDate(r.date)}</time></div><p>${r.text}</p></article>`).join('')}</div></article></div><article class="card timeline-card"><h2 class="section-title">${icon('clock')}Public Timeline</h2><ol class="timeline">${timeline(i.timeline)}</ol></article></div><section class="card actions"><button class="action" data-action="Add evidence">${icon('plus')}Add evidence</button><button class="action primary" data-action="Follow updates">${icon('bookmark')}Follow updates</button><button class="action" data-action="Verify resolution">${icon('check')}Verify resolution</button></section>`;document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>showUnavailable(b.dataset.action))}function showUnavailable(title){$('#dialog-title').textContent=title;$('#unavailable').showModal()}const id=new URLSearchParams(location.search).get('id');fetch('mock-data.json',{cache:'no-store'}).then(r=>r.json()).then(rows=>{const issue=rows.find(i=>i.id===id)||rows[0];render(issue)}).catch(()=>{$('#view').innerHTML='<section class="card empty">Issue details could not be loaded.</section>'});$('#ok').onclick=()=>$('#unavailable').close();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>location.href=b.dataset.page);document.querySelectorAll('[data-unavailable]').forEach(b=>b.onclick=()=>showUnavailable(b.dataset.unavailable));$('.menu').onclick=()=>document.querySelector('.topbar nav').classList.toggle('open');
</script></body></html>
